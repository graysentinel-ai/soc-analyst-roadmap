
title: Suspicious PowerShell Execution
id: 7d8f9a21-4b6c-4e2a-9f10-8a5c3d2e1b70
status: experimental
description: Detects PowerShell execution using command-line options that may warrant further investigation.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: GraySentinel Cyber Defence Lab
date: 2026-11-14
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-WindowStyle Hidden'
      - '-ExecutionPolicy Bypass'
  condition: selection
falsepositives:
  - Authorized administrative scripts
  - Approved automation tasks
  - Legitimate software installation activity
level: medium
